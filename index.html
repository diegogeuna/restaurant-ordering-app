<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrimba Solo Project: Restaurant Ordering App</title>
    <link rel="stylesheet" href="./stylesheet.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
<body>
    <main id="main-container">
        <header class="header">
            <h1 class="header-title">Jimmy's Diner</h1>
            <p class="header-description">The best burgers and pizzas in town.</p>
        </header>
        <section id="menu-container"></section>
        <section id="order-container"></section>
        <section id="payment-container">
            <div class="modal">
                <h3>Enter card details</h3>
                <form id="payment-form" method="POST">
                    <input type="text" id="name" name="name" placeholder="Enter your name" required/>
                    <input type="text" id="card-number" name="card-number" placeholder="Enter card number" required/>
                    <input type="text" id="cvv-number" name="cvv-number" placeholder="Enter CVV" inputmode="numeric" maxlength="4" pattern="\d{3,4}" title="The CVV must have 3 to 4 digits" required/>
                    <button type="submit" data-id="pay-btn" class="pay-btn">Pay</button>
                </form>
            </div>
        </section>
    </main>
    <script type="module" src="index.js"></script>
</body>
</html>
